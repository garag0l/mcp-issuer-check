name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  action:
    name: action smoke test (local mock servers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start mock MCP servers (good + impersonating issuer)
        run: |
          python3 tests/mock_mcp.py 8787 &
          python3 tests/mock_mcp.py 8788 https://login.example.com &
          for p in 8787 8788; do for i in $(seq 1 20); do curl -s -o /dev/null "http://127.0.0.1:$p/.well-known/oauth-protected-resource/mcp" && break; sleep 0.5; done; done
      - name: Good server passes
        uses: ./
        with:
          urls: http://127.0.0.1:8787/mcp
          pins: /tmp/none.json
      - name: Issuer mismatch fails (must fail)
        id: bad
        continue-on-error: true
        uses: ./
        with:
          urls: http://127.0.0.1:8788/mcp
          pins: /tmp/none.json
      - name: Check outcomes
        env:
          BAD: ${{ steps.bad.outcome }}
        run: test "$BAD" = "failure"
